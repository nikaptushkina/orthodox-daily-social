name: Publish approved posts

# Merging a day's pull request into main is the approval.
# 1. On merge: puts the images and videos online with GitHub Pages (Instagram fetches
#    them from there), posts the Story right away, then waits in the same run and posts
#    the feed post at its time (posting_times in config.json, Pacific time). If that is
#    more than 5½ hours away, the run hands over to a fresh run that keeps waiting.
# 2. By hand (Run workflow with a date): the same, posting what's due and waiting for the
#    rest; tick "now" to post everything for that date immediately.
# 3. A schedule as a backup, in case a run was cancelled. GitHub runs it only now and then.
# Nothing is posted unless the PUBLISH_ENABLED repository variable is "true".
on:
  push:
    branches: [main]
    paths: ["posts/**"]
  schedule:
    # Every 15 minutes from about 6 am to midnight Pacific (times are UTC).
    - cron: "7,22,37,52 0-7,13-23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date folder to publish (YYYY-MM-DD)"
        required: true
      now:
        description: "Post everything for this date right away, ignoring the posting times"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # to hand over to a fresh run when the wait is long

jobs:
  pages:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect media
        run: |
          # Only the last two weeks: Instagram fetches media when posting, and Pages sites are capped at 1 GB.
          mkdir -p _site/posts
          since=$(date -u -d "14 days ago" +%F)
          for dir in posts/*/; do
            d=$(basename "$dir")
            if [[ "$d" > "$since" || "$d" == "$since" ]]; then cp -r "$dir" "_site/posts/$d"; fi
          done
          echo "<!doctype html><title>Orthodox Daily media</title><p>Media for @orthodoxdaily posts.</p>" > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: pages
    # Scheduled runs only matter once publishing is switched on.
    if: ${{ !cancelled() && needs.pages.result != 'failure' && (github.event_name != 'schedule' || vars.PUBLISH_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # One publisher at a time, so nothing is ever posted twice.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest main, including what earlier runs recorded as published
          fetch-depth: 0
      - name: Find the days
        id: dates
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dates="${{ github.event.inputs.date }}"
            if [ "${{ github.event.inputs.now }}" = "true" ]; then mode=""; else mode="--when-due --wait 19800"; fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            dates=$(TZ=$(python3 -c "import json;print(json.load(open('config.json'))['timezone'])") date +%F)
            mode="--when-due"
          else
            dates=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- posts \
              | cut -d/ -f2 | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort -u | tr '\n' ' ')
            mode="--when-due --wait 19800"
          fi
          echo "dates=$dates" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Days: $dates $mode"
      - name: Publish
        id: publish
        if: ${{ vars.PUBLISH_ENABLED == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RECORD_PUSH: "1"   # save each post's record right away
        run: |
          git config user.name "orthodox-daily-bot"
          git config user.email "orthodox-daily-bot@users.noreply.github.com"
          status=0
          for d in ${{ steps.dates.outputs.dates }}; do
            if [ -f "posts/$d/post.json" ]; then
              python3 scripts/publish.py "$d" ${{ steps.dates.outputs.mode }} || status=1
            else
              echo "$d: nothing approved for this day."
            fi
          done
          exit $status
      - name: Keep waiting in a fresh run
        if: ${{ steps.publish.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main -f date="${{ steps.publish.outputs.continue_date }}"
      - name: Publishing is switched off
        if: ${{ vars.PUBLISH_ENABLED != 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          echo "Checking the Instagram connection (nothing is posted):"
          python3 scripts/check_connection.py || true
          echo
          echo "PUBLISH_ENABLED is not 'true', so nothing was posted. Dry run:"
          for d in ${{ steps.dates.outputs.dates }}; do
            [ -f "posts/$d/post.json" ] && python3 scripts/publish.py "$d" --dry-run || true
          done
      - name: Record what was published
        if: ${{ always() && vars.PUBLISH_ENABLED == 'true' }}
        run: |
          git config user.name "orthodox-daily-bot"
          git config user.email "orthodox-daily-bot@users.noreply.github.com"
          git add posts/*/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record published posts [skip ci]"
            git pull --rebase
            git push
          fi
