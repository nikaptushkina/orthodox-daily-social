name: Fetch calendar days

# Every night, save the next 15 days of calendar data (New Calendar, Slavic,
# Septuagint + World English Bible) and the saints' icons, so the morning task can build posts.
on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC = 1:17 or 2:17 am Pacific
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-days
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch days
        run: python3 scripts/fetch_days.py 2026-11-21 2026-12-25 2027-01-06 2027-02-15 2027-03-25 2026-12-06 2027-01-30
      - name: Find saint icons (with the site's own lookup)
        continue-on-error: true
        run: python3 scripts/fetch_icons.py
      - name: Screenshots of the website (for "From the website" posts)
        continue-on-error: true
        run: |
          pip install -q playwright==1.63.0
          python -m playwright install --with-deps chromium
          python3 scripts/site_shots.py
      - name: Build the Psalter (first run only)
        continue-on-error: true
        run: |
          if [ ! -f assets/psalter-lxx2012.json ]; then python3 scripts/fetch_psalter.py; fi
      - name: Commit new data
        run: |
          git config user.name "orthodox-daily-bot"
          git config user.email "orthodox-daily-bot@users.noreply.github.com"
          git add days
          git add assets/icons 2>/dev/null || true
          git add assets/site 2>/dev/null || true
          git add assets/psalter-lxx2012.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Calendar data for the coming days"
            git push
          fi
